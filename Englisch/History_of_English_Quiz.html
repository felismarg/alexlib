<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>History of English — Exam Trainer</title>
<style>
  :root{
    --parchment:#efe7d6;
    --ink:#2b2418;
    --ink-soft:#5a4f3c;
    --rune:#7a5c3e;
    --rune-dark:#4e3a26;
    --ok:#3f6b47;
    --bad:#9c3b3b;
    --gold:#a9822f;
    --card:#f7f2e5;
    --line:#d8cba9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #f4ecd8 0%, transparent 60%),
      var(--parchment);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype", Georgia, serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  .runes{
    font-family: Georgia, serif;
    letter-spacing:6px;
    color:var(--rune);
    font-size:13px;
    text-transform:uppercase;
    opacity:0.75;
  }
  h1{
    font-size:2.1rem;
    margin:6px 0 4px;
    letter-spacing:0.5px;
    color:var(--rune-dark);
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:0.95rem;
    font-style:italic;
  }

  .progress-bar{
    height:6px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    margin:20px 0 6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--rune));
    width:0%;
    transition:width .35s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-bottom:18px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px 26px 22px;
    box-shadow:0 2px 0 var(--line), 0 12px 24px -18px rgba(43,36,24,0.4);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:10px;left:10px;right:10px;bottom:10px;
    border:1px solid rgba(122,92,62,0.18);
    border-radius:3px;
    pointer-events:none;
  }
  .qnum{
    font-size:0.78rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.45;
    margin-bottom:18px;
    color:var(--ink);
  }
  .hint{
    font-size:0.82rem;
    color:var(--ink-soft);
    font-style:italic;
    margin:-10px 0 16px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fbf7ec;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .opt:hover{background:#f3ead0; border-color:var(--gold);}
  .opt.selected{border-color:var(--rune); background:#efe2c1;}
  .opt.correct{border-color:var(--ok); background:#e3ecdf;}
  .opt.incorrect{border-color:var(--bad); background:#f1dede;}
  .opt.reveal-correct-unselected{border-color:var(--ok); background:#eef4ec; opacity:0.85;}
  .opt .marker{
    flex:0 0 26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--rune);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.8rem;
    font-weight:600;
    color:var(--rune-dark);
    background:#fff8ea;
  }
  .opt.correct .marker{border-color:var(--ok); color:var(--ok); background:#e3ecdf;}
  .opt.incorrect .marker{border-color:var(--bad); color:var(--bad); background:#f1dede;}
  .opt-text{padding-top:2px; line-height:1.4;}

  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    gap:12px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:0.95rem;
    padding:10px 20px;
    border-radius:4px;
    border:1px solid var(--rune-dark);
    background:var(--rune-dark);
    color:#f7f2e5;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{background:#3a2c1b; transform:translateY(-1px);}
  button:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  button.secondary{
    background:transparent;
    color:var(--rune-dark);
  }
  button.secondary:hover{background:rgba(122,92,62,0.1);}

  .feedback{
    margin-top:16px;
    padding:12px 14px;
    border-radius:4px;
    font-size:0.92rem;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#e3ecdf; color:var(--ok); border:1px solid #b9d0b8;}
  .feedback.bad{background:#f1dede; color:var(--bad); border:1px solid #dcb4b4;}

  .topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .pill{
    font-size:0.78rem;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fbf7ec;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .pill.active{
    background:var(--rune-dark);
    color:#f7f2e5;
    border-color:var(--rune-dark);
  }

  .results{
    text-align:center;
    padding:20px 10px;
  }
  .score-ring{
    width:160px;height:160px;margin:10px auto 20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:2.1rem;
    font-weight:600;
    color:var(--rune-dark);
    background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line) 0);
    position:relative;
  }
  .score-ring::before{
    content:"";
    position:absolute;
    width:126px;height:126px;
    border-radius:50%;
    background:var(--card);
  }
  .score-ring span{position:relative;}
  .missed-list{
    text-align:left;
    margin-top:20px;
  }
  .missed-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .missed-item b{color:var(--rune-dark);}
  .missed-item .ans{color:var(--ok);}

  .topic-list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px;
    margin-top:18px;
    text-align:left;
  }
  .topic-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    background:#fbf7ec;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .topic-card:hover{
    border-color:var(--rune-dark);
    background:#f3ecda;
  }
  .topic-card-title{
    font-weight:600;
    color:var(--rune-dark);
    margin-bottom:4px;
    font-size:0.95rem;
  }
  .topic-card-count{
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .topic-card-all{
    border-style:dashed;
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:0.78rem;
    color:var(--ink-soft);
    opacity:0.7;
  }

  @media (max-width:480px){
    .card{padding:20px 16px;}
    h1{font-size:1.6rem;}
    .score-ring{width:130px;height:130px;font-size:1.6rem;}
    .score-ring::before{width:100px;height:100px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="runes">ᚻᛁᛋᛏᚩᚱᛁᚫ ᛖᚾᚷᛚᛁᛋᚳᚱᛖ</div>
    <h1>History of English — Exam Trainer</h1>

        <button id="nextBtn" style="display:none;">Next →</button>
      </div>
    </div>
  </div>

  <div class="card results" id="topicSelect" style="display:none; text-align:left;">
  </div>

  <div class="card results" id="sectionResults" style="display:none;">
    <div class="qnum">Section complete</div>
    <div class="score-ring" id="sectionScoreRing" style="--pct:0;"><span id="sectionScorePct">0%</span></div>
    <div id="sectionScoreSummary"></div>
    <div class="controls" style="justify-content:center; margin-top:20px; gap:12px;">
      <button class="secondary" id="sectionRepeatBtn">↻ Repeat this section</button>
      <button class="secondary" id="sectionTopicBtn">Choose Another Topic</button>
      <button id="sectionContinueBtn">Next →</button>
    </div>
  </div>

  <div class="card results" id="results" style="display:none;">
    <div class="qnum">Results</div>
    <div class="score-ring" id="scoreRing" style="--pct:0;"><span id="scorePct">0%</span></div>
    <div id="scoreSummary"></div>
    <div class="missed-list" id="missedList"></div>
    <div class="controls" style="justify-content:center; margin-top:20px;">
      <button id="restartBtn">Try Again</button>
    </div>
  </div>

</div>

function tagMC(arr){ return arr.map(q => [q[0], q[1], q[2], 'mc']); }

// ---- Topic classification for MC questions ----
// Heuristic keyword-based classifier so questions can be grouped and practiced by topic.
const TOPIC_ORDER = [
  'Indo-European & Language Families',
  "Germanic Languages & Grimm's/Verner's Law",
  'Sound & Vowel Changes (Ablaut, Mutation, GVS)',
  'Old English',
  'Middle English',
  'Early Modern English & Purism',
  'External History & Key Events',
  'Language Change: Theory & Mechanisms',
  'General / Other'
];

function classifyTopic(q){
  const raw = q[0] + ' ' + q[1].join(' ');
  const text = raw.toLowerCase();
  const has = (...kws) => kws.some(k=>text.includes(k));
  const word = (re) => re.test(raw);

  if(has('grimm', 'verner', 'first germanic sound shift', 'second germanic sound shift')) {
    return "Germanic Languages & Grimm's/Verner's Law";
  }
  if(has('ablaut', 'i-mutation', 'mutation', 'great vowel shift', 'vowel shift', 'diphthong', 'palatal', 'palatis', 'palataliz', 'fricative', 'phoneme', 'split of /k/', 'consonant clusters')) {
    return 'Sound & Vowel Changes (Ablaut, Mutation, GVS)';
  }
  if(has('battle of hastings', 'caxton', 'viking', 'scandinavian invasion', 'danelaw', 'canute', 'book printing', 'canterbury tales', 'ruthwell')) {
    return 'External History & Key Events';
  }
  if(has('indo-european', 'sanskrit', 'proto-indo', 'kentum', 'satem', 'cognate', 'william jones', 'language family', 'genetically related', 'proto-language', 'semitic', 'parent language')) {
    return 'Indo-European & Language Families';
  }
  if(has('early modern english', 'purist', 'inkhorn', 'hard word', 'language academy', 'renaissance')) {
    return 'Early Modern English & Purism';
  }
  if(has('middle english', 'norman conquest', 'anglo-norman', 'chaucer', 'french influence', 'french aristocracy') || word(/\bME\b/)) {
    return 'Middle English';
  }
  if(has('old english', 'anglo-saxon', 'angles', 'saxons', 'jutes', 'runic') || word(/\bOE\b/)) {
    return 'Old English';
  }
  if(has('functional load', 'redundan', 'analog', 'doublet', 'synonym', 'dissociated', 'language change')) {
    return 'Language Change: Theory & Mechanisms';
  }
  return 'General / Other';
}

// Sort MC questions topic-wise (stable within each topic, following TOPIC_ORDER)
const mcTopicOf = mcAll.map(classifyTopic);
const mcSortedIndices = mcAll.map((_,i)=>i).sort((a,b)=>{
  const ta = TOPIC_ORDER.indexOf(mcTopicOf[a]);
  const tb = TOPIC_ORDER.indexOf(mcTopicOf[b]);
  if(ta!==tb) return ta-tb;
  return a-b;
});
const mcSorted = mcSortedIndices.map(i=>mcAll[i]);
const mcSortedTopics = mcSortedIndices.map(i=>mcTopicOf[i]);

// Build contiguous topic sections over the topic-sorted MC array
function computeTopicSections(topics){
  const secs = [];
  let start = 0;
  for(let i=1;i<=topics.length;i++){
    if(i===topics.length || topics[i]!==topics[start]){
      secs.push({start, end:i, label: topics[start]});
      start = i;
    }
  }
  return secs;
}
const mcTopicSections = computeTopicSections(mcSortedTopics);

const banks = {
  mc: {label:"Multiple Choice", data: mcSorted},
  open: {label:"Open Questions", data: openQuestions},
  all: {label:"All Question Types", data: mcSorted.concat(openQuestions)}
};

// ---- Sectioning (only used for the "mc" bank) ----
const SECTION_SIZE = 15;

function computeSections(n, size){
  const count = Math.max(1, Math.round(n/size));
  const base = Math.floor(n/count);
  const extra = n - base*count;
  const secs = [];
  let idx = 0;
  for(let i=0;i<count;i++){
    const len = base + (i<extra ? 1 : 0);
    secs.push({start: idx, end: idx+len});
    idx += len;
  }
  return secs;
}

let currentBankKey = "all";
let questions = [];
let current = 0;
let selected = [];
let checked = [];
let openAnswers = [];
let optOrders = [];
let score = 0;
let isSectioned = false;
let sections = [];
let currentSection = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initBank(key, startSection){
  currentBankKey = key;
  questions = banks[key].data;
  selected = questions.map(()=>[]);
  checked = questions.map(()=>false);
  openAnswers = questions.map(()=>'');
  optOrders = questions.map(q => q[3]==='open' ? null : shuffle([...Array(q[1].length).keys()]));
  score = 0;
  isSectioned = (key === 'mc');
  sections = isSectioned ? mcTopicSections : [{start:0, end:questions.length}];
  renderTopbar();

  if(isSectioned && startSection === undefined){
    showTopicPicker();
    return;
  }

  currentSection = startSection || 0;
  current = sections[currentSection].start;
  document.getElementById('topicSelect').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('sectionResults').style.display='none';
  document.getElementById('quizArea').style.display='block';
  renderQuestion();
}

function showTopicPicker(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('sectionResults').style.display='none';
  const wrap = document.getElementById('topicSelect');
  wrap.style.display='block';
  wrap.innerHTML = '<div class="qnum">Choose a topic to practice</div>' +
    '<p style="color:var(--ink-soft); font-size:0.9rem; margin-top:6px;">Multiple choice questions are grouped by topic. Pick one to focus on, or run through everything.</p>' +
    '<div class="topic-list" id="topicList"></div>';
  const list = document.getElementById('topicList');
  sections.forEach((sec, idx)=>{
    const btn = document.createElement('div');
    btn.className = 'topic-card';
    const count = sec.end - sec.start;
    btn.innerHTML = '<div class="topic-card-title">' + sec.label + '</div><div class="topic-card-count">' + count + ' question' + (count===1?'':'s') + '</div>';
    btn.onclick = ()=> initBank('mc', idx);
    list.appendChild(btn);
  });
  const allBtn = document.createElement('div');
  allBtn.className = 'topic-card topic-card-all';
  allBtn.innerHTML = '<div class="topic-card-title">All Topics (full run)</div><div class="topic-card-count">' + questions.length + ' questions</div>';
  allBtn.onclick = ()=> initBank('mc', 0);
  list.appendChild(allBtn);
}

function renderTopbar(){
  const tb = document.getElementById('topbar');
  tb.innerHTML = '';
  Object.keys(banks).forEach(key=>{
    const p = document.createElement('div');
    p.className = 'pill' + (key===currentBankKey ? ' active' : '');
    p.textContent = banks[key].label + ' (' + banks[key].data.length + ')';
    p.onclick = ()=>initBank(key);
    tb.appendChild(p);
  });
}

function renderQuestion(){
  const q = questions[current];
  const isOpen = q[3] === 'open';
  const sectionLabel = isSectioned ? ('Section ' + (currentSection+1) + '/' + sections.length + ' · ') : '';
  document.getElementById('qnum').textContent = sectionLabel + 'Question ' + (current+1) + ' of ' + questions.length + (isOpen ? ' · Open Question' : (q[2].length>1 ? ' · Multiple Answers' : ' · Single Answer'));
  document.getElementById('qtext').innerHTML = q[0];

  const optsDiv = document.getElementById('options');
  const openWrap = document.getElementById('openAnswerWrap');
  const openTextarea = document.getElementById('openAnswer');
  optsDiv.innerHTML = '';

  if(isOpen){
    optsDiv.style.display = 'none';
    openWrap.style.display = 'block';
    openTextarea.value = openAnswers[current] || '';
    openTextarea.disabled = false;
    openTextarea.oninput = ()=>{ openAnswers[current] = openTextarea.value; };
  } else {
    optsDiv.style.display = 'flex';
    openWrap.style.display = 'none';
    const order = optOrders[current];
    order.forEach((origIdx, dispIdx)=>{
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.dataset.origIdx = origIdx;
      opt.innerHTML = '<div class="marker">'+letters[dispIdx]+'</div><div class="opt-text">'+q[1][origIdx]+'</div>';
      opt.onclick = ()=>toggleOption(origIdx);
      optsDiv.appendChild(opt);
    });
  }

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('repeatBtn').style.display = 'none';
  document.getElementById('checkBtn').style.display = 'inline-block';
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('checkBtn').textContent = isOpen ? 'Show Answer' : 'Check';
  document.getElementById('prevBtn').disabled = isSectioned ? (current === sections[currentSection].start) : (current===0);

  if(checked[current]){
    showResult();
  } else if(!isOpen){
    updateSelectionVisual();
  }

  updateProgress();
}

function toggleOption(idx){
  if(checked[current]) return;
  const arr = selected[current];
  const pos = arr.indexOf(idx);
  if(pos>=0) arr.splice(pos,1); else arr.push(idx);
  updateSelectionVisual();
}

function updateSelectionVisual(){
  const opts = document.querySelectorAll('.opt');
  opts.forEach((el)=>{
    const origIdx = parseInt(el.dataset.origIdx, 10);
    el.classList.toggle('selected', selected[current].includes(origIdx));
  });
}

function showResult(){
  const q = questions[current];
  if(q[3] === 'open'){
    document.getElementById('openAnswer').disabled = true;
    const fb = document.getElementById('feedback');
    fb.classList.add('show','ok');
    fb.classList.remove('bad');
    const pointsLabel = q[5] ? (' (' + q[5] + ' pts)') : '';
    fb.innerHTML = '<b>Sample Answer'+pointsLabel+':</b><br>' + q[4];
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.getElementById('repeatBtn').style.display = 'inline-block';
    return;
  }
  const opts = document.querySelectorAll('.opt');
  const correctSet = new Set(q[2]);
  const selSet = new Set(selected[current]);
  opts.forEach((el)=>{
    const origIdx = parseInt(el.dataset.origIdx, 10);
    el.classList.remove('selected');
    if(correctSet.has(origIdx) && selSet.has(origIdx)){
      el.classList.add('correct');
    } else if(!correctSet.has(origIdx) && selSet.has(origIdx)){
      el.classList.add('incorrect');
    } else if(correctSet.has(origIdx) && !selSet.has(origIdx)){
      el.classList.add('reveal-correct-unselected');
    }
  });
  const isRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if(isRight){
    fb.classList.add('ok'); fb.classList.remove('bad');
    fb.textContent = '✓ Correct! ' + (q[2].length>1 ? 'You found all the correct answers.' : '');
  } else {
    fb.classList.add('bad'); fb.classList.remove('ok');
    const order = optOrders[current];
    const correctLetters = q[2].map(origIdx=>letters[order.indexOf(origIdx)]).join(', ');
    fb.textContent = '✗ Not quite — the correct answer is: ' + correctLetters;
  }
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('repeatBtn').style.display = 'inline-block';
}

document.getElementById('checkBtn').onclick = ()=>{
  const q = questions[current];
  const isOpen = q[3] === 'open';
  if(isOpen){
    const openTextarea = document.getElementById('openAnswer');
    openAnswers[current] = openTextarea.value;
    if(openAnswers[current].trim()==='') return;
    checked[current] = true;
    updateProgress();
    showResult();
    return;
  }
  if(selected[current].length===0) return;
  checked[current] = true;
  const correctSet = new Set(q[2]);
  const selSet = new Set(selected[current]);
  const isRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
  if(isRight) score++;
  updateProgress();
  showResult();
};

document.getElementById('nextBtn').onclick = ()=>{
  if(isSectioned){
    const sec = sections[currentSection];
    if(current < sec.end - 1){
      current++;
      renderQuestion();
    } else {
      showSectionResults();
    }
  } else {
    if(current < questions.length-1){
      current++;
      renderQuestion();
    } else {
      showResults();
    }
  }
};

document.getElementById('prevBtn').onclick = ()=>{
  const floor = isSectioned ? sections[currentSection].start : 0;
  if(current>floor){
    current--;
    renderQuestion();
  }
};

document.getElementById('repeatBtn').onclick = ()=>{
  const q = questions[current];
  if(q[3] !== 'open' && checked[current]){
    const correctSet = new Set(q[2]);
    const selSet = new Set(selected[current]);
    const wasRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
    if(wasRight) score--;
  }
  selected[current] = [];
  checked[current] = false;
  openAnswers[current] = '';
  if(q[3] !== 'open'){
    optOrders[current] = shuffle([...Array(q[1].length).keys()]);
  }
  renderQuestion();
};

function updateProgress(){
  const answered = checked.filter(Boolean).length;
  document.getElementById('topicSwitchBtn').style.display = isSectioned ? 'inline' : 'none';
  if(isSectioned){
    const sec = sections[currentSection];
    const secLen = sec.end - sec.start;
    const posInSec = current - sec.start + 1;
    document.getElementById('progressFill').style.width = ((posInSec-1)/(secLen-1||1)*100) + '%';
    document.getElementById('progressText').textContent = 'Question ' + posInSec + ' / ' + secLen + '  ·  Section ' + (currentSection+1) + '/' + sections.length;
  } else {
    document.getElementById('progressFill').style.width = ((current)/(questions.length-1||1)*100) + '%';
    document.getElementById('progressText').textContent = 'Question ' + (current+1) + ' / ' + questions.length;
  }
  document.getElementById('scoreText').textContent = 'Score: ' + score + ' / ' + answered;
}

function showSectionResults(){
  const sec = sections[currentSection];
  let secScore = 0;
  let secGraded = 0;
  for(let i=sec.start;i<sec.end;i++){
    if(questions[i][3] === 'open') continue;
    secGraded++;
    const correctSet = new Set(questions[i][2]);
    const selSet = new Set(selected[i]);
    const isRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
    if(isRight) secScore++;
  }
  const secLen = secGraded || (sec.end - sec.start);
  const pct = Math.round(secScore/secLen*100);

  document.getElementById('quizArea').style.display='none';
  const sres = document.getElementById('sectionResults');
  sres.style.display='block';
  document.getElementById('sectionScoreRing').style.setProperty('--pct', pct);
  document.getElementById('sectionScorePct').textContent = pct + '%';

  const isLast = currentSection === sections.length-1;
  document.getElementById('sectionScoreSummary').innerHTML =
    '<p style="font-size:1.05rem;">Section ' + (currentSection+1) + ' of ' + sections.length + ' complete.<br>You answered <b>' + secScore + ' of ' + secLen + '</b> questions correctly in this section.</p>' +
    '<p style="font-size:0.9rem; color:var(--ink-soft);">Overall so far: ' + score + ' of ' + sec.end + ' questions correct.</p>';

  document.getElementById('sectionContinueBtn').textContent = isLast ? 'Show Final Results →' : 'Continue to Next Section →';
}

document.getElementById('topicSwitchBtn').onclick = ()=> showTopicPicker();
document.getElementById('sectionTopicBtn').onclick = ()=> showTopicPicker();

document.getElementById('sectionRepeatBtn').onclick = ()=>{
  const sec = sections[currentSection];
  for(let i=sec.start;i<sec.end;i++){
    const q = questions[i];
    if(q[3] !== 'open' && checked[i]){
      const correctSet = new Set(q[2]);
      const selSet = new Set(selected[i]);
      const wasRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
      if(wasRight) score--;
    }
    selected[i] = [];
    checked[i] = false;
    openAnswers[i] = '';
    if(q[3] !== 'open'){
      optOrders[i] = shuffle([...Array(q[1].length).keys()]);
    }
  }
  current = sec.start;
  document.getElementById('sectionResults').style.display='none';
  document.getElementById('quizArea').style.display='block';
  renderQuestion();
};

document.getElementById('sectionContinueBtn').onclick = ()=>{
  const isLast = currentSection === sections.length-1;
  document.getElementById('sectionResults').style.display='none';
  if(isLast){
    showResults();
  } else {
    currentSection++;
    current = sections[currentSection].start;
    document.getElementById('quizArea').style.display='block';
    renderQuestion();
  }
};

function showResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('sectionResults').style.display='none';
  const res = document.getElementById('results');
  res.style.display='block';
  const total = questions.filter(q=>q[3] !== 'open').length || questions.length;
  const pct = Math.round(score/total*100);
  document.getElementById('scoreRing').style.setProperty('--pct', pct);
  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreSummary').innerHTML = '<p style="font-size:1.05rem;">You answered <b>' + score + ' of ' + total + '</b> questions correctly.</p>';

  const missedDiv = document.getElementById('missedList');
  missedDiv.innerHTML = '';
  questions.forEach((q,idx)=>{
    if(q[3] === 'open') return;
    const correctSet = new Set(q[2]);
    const selSet = new Set(selected[idx]);
    const isRight = correctSet.size===selSet.size && [...correctSet].every(x=>selSet.has(x));
    if(!isRight){
      const div = document.createElement('div');
      div.className = 'missed-item';
      div.innerHTML = '<b>Question '+(idx+1)+':</b> ' + q[0] + '<br><span class="ans">Correct: ' + q[2].map(i=>letters[i]+') '+q[1][i]).join(' · ') + '</span>';
      missedDiv.appendChild(div);
    }
  });
  if(missedDiv.innerHTML===''){
    missedDiv.innerHTML = '<p style="text-align:center; color:var(--ok); font-weight:600;">All questions correct — you\'re well prepared for the exam!</p>';
  }
}

document.getElementById('restartBtn').onclick = ()=>initBank(currentBankKey);

// init
initBank('all');
</script>
